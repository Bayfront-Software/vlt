<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>vlt</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <!-- 画面上端の帯でウインドウを動かす。子要素を持たせないこと（子の上ではドラッグが効かない）。 -->
  <div class="drag-strip" data-tauri-drag-region></div>

  <!-- 初期化前: マスターキーが Keychain に無い -->
  <section id="screen-setup" class="screen gate" hidden>
    <div class="gate-card">
      <div class="gate-mark" id="setup-mark"></div>
      <h1>vlt をはじめる</h1>
      <p>マスターキーを生成して macOS のキーチェーンに保存します。<br>vault はこの Mac の中だけで復号できます。</p>
      <button class="btn primary" data-action="init">vault を作成</button>
      <p class="gate-error" id="setup-error" role="alert"></p>
    </div>
  </section>

  <!-- ロック中: メモリ上に vault を持っていない -->
  <section id="screen-locked" class="screen gate" hidden>
    <div class="gate-card">
      <div class="gate-mark" id="locked-mark"></div>
      <h1>vlt はロックされています</h1>
      <p class="gate-reason" id="lock-reason"></p>
      <button class="btn primary big" data-action="unlock" id="btn-unlock">解錠</button>
      <p class="gate-hint" id="unlock-hint"></p>
      <p class="gate-error" id="locked-error" role="alert"></p>
    </div>
  </section>

  <!-- 本体: サイドバー / 一覧 / 詳細 -->
  <section id="screen-main" class="screen main" hidden>
    <aside class="sidebar">
      <nav id="categories" class="categories" aria-label="分類"></nav>
      <div class="sidebar-bottom">
        <button class="icon-btn" data-action="open-generator" title="パスワード生成" aria-label="パスワード生成" id="btn-generator"></button>
        <button class="icon-btn" data-action="open-settings" title="設定" aria-label="設定" id="btn-settings"></button>
        <span class="spacer"></span>
        <button class="icon-btn" data-action="lock" title="ロック ⌘L" aria-label="ロック" id="btn-lock"></button>
      </div>
    </aside>

    <section class="list-pane">
      <div class="list-head">
        <div class="search">
          <span id="search-icon"></span>
          <input id="search" type="search" placeholder="検索" autocomplete="off" spellcheck="false" />
          <kbd>⌘F</kbd>
        </div>
        <button class="btn primary new-btn" data-action="new" title="新規 ⌘N" id="btn-new">新規</button>
      </div>
      <div class="list-title">
        <h2 id="list-heading"></h2>
        <span id="list-count" class="muted"></span>
        <span class="spacer"></span>
        <button class="btn ghost small" data-action="empty-trash" id="btn-empty-trash" hidden>ゴミ箱を空にする</button>
      </div>
      <nav id="list" class="list" aria-label="項目"></nav>
    </section>

    <main class="detail" id="detail">
      <div id="detail-empty" class="detail-empty"></div>
      <article id="detail-item" class="detail-body" hidden></article>
      <article id="detail-trash" class="detail-body" hidden></article>

      <form id="editor" class="detail-body editor" autocomplete="off" hidden>
        <header class="editor-head">
          <span id="edit-badge"></span>
          <div class="editor-titles">
            <p class="muted" id="edit-type"></p>
            <input id="edit-key" class="title-input" placeholder="名前（例: github/login）" spellcheck="false" />
            <p class="hint">「/」で区切ると名前空間になります。秘密参照は <code id="edit-ref-preview">vlt://…</code></p>
          </div>
        </header>
        <section class="card" id="edit-fields"></section>
        <div class="add-field">
          <button type="button" class="btn ghost small" data-action="add-field" id="btn-add-field">フィールドを追加</button>
        </div>
        <section class="card">
          <label class="field-label" for="edit-notes">メモ</label>
          <textarea id="edit-notes" rows="4" spellcheck="false"></textarea>
        </section>
        <section class="card">
          <label class="field-label" for="edit-tags">タグ（カンマ区切り）</label>
          <input id="edit-tags" spellcheck="false" placeholder="work, dev" />
          <label class="check"><input type="checkbox" id="edit-favorite"> お気に入り</label>
        </section>
        <p class="form-error" id="edit-error" role="alert"></p>
        <footer class="editor-foot">
          <button type="button" class="btn secondary" data-action="edit-cancel">キャンセル</button>
          <button type="submit" class="btn primary">保存 <kbd>⌘S</kbd></button>
        </footer>
      </form>
    </main>
  </section>

  <!-- 汎用ダイアログ。中身は app.js が組み立てる -->
  <div id="modal" class="modal" hidden>
    <form id="modal-form" class="modal-card" autocomplete="off">
      <h3 id="modal-title"></h3>
      <div id="modal-body" class="modal-body"></div>
      <p id="modal-error" class="form-error" role="alert"></p>
      <div class="modal-buttons">
        <button type="button" class="btn secondary" data-action="modal-cancel" id="modal-cancel">キャンセル</button>
        <button type="submit" class="btn primary" id="modal-ok">OK</button>
      </div>
    </form>
  </div>

  <div id="popover" class="popover" hidden></div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
